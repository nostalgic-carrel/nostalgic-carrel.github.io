   <h2>「吹奏楽」のページ</h2>
   <p>中学生の時に吹奏楽を初めて早4年。当時はトランペットを吹いていましたが、高校に入ってパートを移動して、今年の5月からホルンを吹いています。高音域はわりによく出ますが、低音域がまだまだ難しいところです。吹奏楽の曲で好きなのは、真島敏夫作曲の<a href="https://www.youtube.com/watch?v=Qu8eALo_ftA">「地球 美しき惑星」</a>と、フィリープ・スパーク作曲の<a href="https://www.youtube.com/watch?v=gs52Fqu-suM">「宇宙の音楽」</a>です。宇宙の音楽の方は中学3年生の吹コンで演奏しました。</p>
